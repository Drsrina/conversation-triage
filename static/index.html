<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation Triage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 600px;
      padding: 32px;
    }
    h1 {
      font-size: 24px;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 24px;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    button {
      margin-top: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      background: #f8f9fa;
      display: none;
    }
    .result.show { display: block; }
    .sentiment {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .sentiment.positivo { background: #d4edda; color: #155724; }
    .sentiment.negativo { background: #f8d7da; color: #721c24; }
    .sentiment.neutro { background: #d1ecf1; color: #0c5460; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
    }
    .error { color: #dc3545; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Conversation Triage</h1>
    <p class="subtitle">Classificador de conversas de atendimento — sentimento + tags</p>

    <textarea id="msg" placeholder="Digite a mensagem do cliente..."></textarea>
    <button onclick="predict()" id="btn">Analisar</button>

    <div id="result" class="result">
      <div id="sentimentEl"></div>
      <div class="tags" id="tagsEl"></div>
    </div>
    <div id="error" class="error"></div>
  </div>

  <script>
    async function predict() {
      const msg = document.getElementById('msg').value.trim();
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');
      const error = document.getElementById('error');

      if (!msg) {
        error.textContent = 'Digite uma mensagem primeiro.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Analisando...';
      error.textContent = '';
      result.classList.remove('show');

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversation: msg })
        });

        if (!res.ok) throw new Error('Erro na API');

        const data = await res.json();
        const sentimentEl = document.getElementById('sentimentEl');
        const tagsEl = document.getElementById('tagsEl');

        sentimentEl.textContent = data.sentiment;
        sentimentEl.className = 'sentiment ' + data.sentiment;

        tagsEl.innerHTML = '';
        data.tags.forEach(t => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = t;
          tagsEl.appendChild(span);
        });

        result.classList.add('show');
      } catch (e) {
        error.textContent = 'Erro ao conectar com a API: ' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Analisar';
      }
    }

    document.getElementById('msg').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) predict();
    });
  </script>
</body>
</html>
